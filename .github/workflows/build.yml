# Workflow for - Validating all the code using ESLint
# Triggered when -
# 1 - Pull Request opened against "sprint-master" or "package-**" branch
# 2 - Any push on "sprint-master" or "package-**" branch
# This workflow also has caching ability which means node_modules will only get installed whenever there is a change in package-lock.json file
# which helps in faster excecution of workflow even this cached node_modules can be shared acorss all other workflows triggered for same branches
# For more detail on caching, read here - https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache

name: build

on:
  pull_request:
    branches:
      - 'master'


jobs:
  lint:
    name: "Builing code"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ang

    steps:
      - name: "Slack Notification"
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Danny Torrence left a 1 star review for your property."
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Danny Torrence left the following review for your property:"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "<https://example.com|*Overlook Hotel*> :star: \n Doors had too many axe holes, guest in room 237 was far too rowdy, whole place felt stuck in the 1920s."
                accessory:
                  type: "image"
                  image_url: "https://is5-ssl.mzstatic.com/image/thumb/Purple3/v4/d3/72/5c/d3725c8f-c642-5d69-1904-aa36e4297885/source/256x256bb.jpg"
                  alt_text: "Haunted hotel image"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Average Rating*: 1.0"
